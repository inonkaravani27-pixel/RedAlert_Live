services:
  - type: web
    name: redalert-live
    runtime: node
    plan: free           # לניסוי בלבד; השירות החינמי עשוי להירדם
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: POLL_MS
        value: "10000"
      - key: STALE_MS
        value: "45000"
      - key: MAX_AGE_MS
        value: "1800000"
      - key: PRELIM_RSS_URLS
        value: "https://www.ynet.co.il/Integration/StoryRss1854.xml,https://www.ynet.co.il/Integration/StoryRss3082.xml,https://www.jpost.com/rss/rssfeedsheadlines.aspx,https://www.jpost.com/rss/rssfeedsisraelnews.aspx,https://www.jpost.com/rss/rssfeedsmiddleeastnews.aspx,https://www.jpost.com/rss/rssfeedsiran,https://www.aljazeera.net/aljazeerarss/a7c186be-1adb-4b11-a982-4783e765316e/4e17ecdc-8fb9-40de-a5d6-d00f72384a51,https://www.alarabiya.net/tools/mrss/?cat=main,https://feeds.bbci.co.uk/persian/rss.xml,https://www.theguardian.com/world/middleeast/rss"
      - key: PRELIM_KEYWORDS
        value: "מבזק,התרעה,אזעקה,פיקוד העורף,ירי,טיל,רקטה,חדירה,איראן,לבנון,חיזבאללה,תקיפה,מלחמה,عاجل,إسرائيل,إيران,لبنان,صاروخ,قصف,هجوم,غارة,حرب,انفجار,حزب الله,پهپاد,موشک,حمله,اسرائیل,لبنان,ایران"
